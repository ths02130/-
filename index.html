<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>다중 트랙 & 악기 선택 작곡 프로그램</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1b1b1b; color: #fff; padding: 15px; margin: 0; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; color: #fff; }
        .section-title { font-size: 1rem; color: #00adb5; margin-top: 20px; font-weight: bold; }
        
        /* 상단 템포(BPM) 및 유틸리티 컨트롤 */
        .global-status-bar { background: #111; padding: 12px; margin: 10px auto; max-width: 95%; border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
        .bpm-container { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .bpm-slider { width: 130px; cursor: pointer; }
        .bpm-display { color: #ffc107; font-size: 1.1rem; min-width: 65px; }
        .duration-display { background: #222; border: 1px solid #00adb5; color: #00adb5; padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
        
        /* 트랙 관리 영역 */
        .track-control-panel { background: #2a2a2a; padding: 15px; border-radius: 10px; max-width: 95%; margin: 15px auto; text-align: left; }
        .track-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .track-item { display: flex; align-items: center; justify-content: space-between; background: #333; padding: 10px 15px; border-radius: 6px; border-left: 6px solid #888; flex-wrap: wrap; gap: 10px; }
        .track-item.active { background: #3a3f44; }
        .track-info { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .track-name-input { background: #222; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem; width: 120px; }
        .sound-select { background: #222; color: #ffc107; border: 1px solid #00adb5; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        .track-btn { padding: 6px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; }
        .select-track-btn { background: #00adb5; color: white; }
        .delete-track-btn { background: #dc3545; color: white; }

        /* 패턴 매니저 */
        .pattern-manager { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 95%; margin: 10px auto; background: #2a2a2a; padding: 12px; border-radius: 10px; min-height: 50px; }
        .pattern-item { display: flex; flex-direction: column; align-items: center; background: #333; padding: 6px; border-radius: 6px; border: 1px solid #444; width: 90px; }
        .pattern-item.active { border-color: #00adb5; background: #243536; }
        .p-select-btn { width: 100%; padding: 5px 0; font-weight: bold; background: #444; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px; font-size: 0.8rem; }
        .pattern-item.active .p-select-btn { background: #00adb5; }
        .p-name-input { width: 90%; font-size: 0.7rem; padding: 2px; border: 1px solid #555; background: #222; color: #fff; text-align: center; border-radius: 3px; box-sizing: border-box; }

        /* 유틸리티 바 버튼들 */
        .util-bar { margin: 10px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .util-btn { padding: 6px 14px; font-size: 0.85rem; background: #4f5b66; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .undo-btn { background: #dc3545; color: white; }
        .undo-btn:disabled { background: #444; color: #777; cursor: not-allowed; }

        /* 격자판 */
        .grid-viewport { overflow-x: auto; background: #1a1a1a; border-radius: 12px; padding: 15px 10px; margin: 10px auto; max-width: 98%; }
        .grid { display: grid; grid-template-columns: repeat(16, 36px); gap: 10px 8px; justify-content: start; width: max-content; }
        .note-btn { width: 36px !important; height: 45px !important; min-width: 36px; box-sizing: border-box; background: #444; border: 2px solid transparent; border-radius: 6px; cursor: pointer; }
        
        .note-btn.on { background: #00adb5 !important; box-shadow: 0 0 6px #00adb5; }
        .note-btn.playing { border-color: #fff; background: #555; }
        .note-btn.on.playing { border-color: #fff; filter: brightness(1.5); }

        /* 하단 조립 타임라인 */
        .timeline-area { background: #2a2a2a; padding: 15px; border-radius: 12px; max-width: 95%; margin: 15px auto; }
        .timeline-container { display: flex; gap: 8px; justify-content: start; margin: 15px 0; overflow-x: auto; padding-bottom: 10px; }
        .timeline-block { background: #333; border: 2px solid #555; border-radius: 6px; padding: 6px; width: 120px; text-align: center; flex-shrink: 0; }
        .timeline-block.current { border-color: #ffc107; background: #443c25; }
        .timeline-label { font-size: 0.75rem; font-weight: bold; margin-bottom: 6px; color: #aaa; }
        .timeline-block select { background: #222; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 2px; width: 100%; cursor: pointer; font-size: 0.75rem; margin-bottom: 4px; }

        /* 마디 조절 버튼 */
        .bar-control-btn { padding: 6px 14px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; margin: 0 5px; }
        .add-bar { background: #00adb5; color: white; }
        .remove-bar { background: #6c757d; color: white; }

        /* 제어 버튼 */
        .controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button.main-btn { padding: 12px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; min-width: 140px; }
        .play-btn { background: #28a745; color: white; }
        .wav-btn { background: #ffc107; color: black; }
        .midi-btn { background: #007bff; color: white; }
    </style>
</head>
<body>

    <h1>🎼 멀티 트랙 & 악기 선택 작곡 프로그램</h1>

    <!-- 상단 템포 및 글로벌 패널 -->
    <div class="global-status-bar">
        <div class="bpm-container">
            <span>속도 (BPM):</span>
            <input type="range" id="bpmSlider" class="bpm-slider" min="60" max="200" value="120">
            <span id="bpmDisplay" class="bpm-display">120 BPM</span>
        </div>
        <div class="duration-display" id="totalDurationDisplay">⏱️ 총 길이: 0분 0초</div>
    </div>

    <!-- 1단계: 멀티 트랙 & 악기 소리 설정 -->
    <div class="track-control-panel">
        <div class="section-title" style="margin-top:0;">1단계: 트랙 및 악기 음색 설정</div>
        <div class="track-list" id="trackListContainer"></div>
        <button class="track-btn select-track-btn" id="addTrackBtn">+ 새 트랙 추가</button>
    </div>
    
    <!-- 2단계: 패턴 선택 -->
    <div class="section-title">2단계: 현재 트랙의 패턴 선택 및 수정</div>
    <div class="pattern-manager" id="patternManagerContainer"></div>

    <!-- 유틸리티 바 -->
    <div class="util-bar">
        <button class="util-btn undo-btn" id="undoBtn" disabled>↩ 되돌리기 (Undo)</button>
        <button class="util-btn" id="copyPatternBtn">패턴 복사</button>
        <button class="util-btn" id="pastePatternBtn">붙여넣기</button>
    </div>

    <!-- 16비트 격자판 -->
    <div class="grid-viewport">
        <div class="grid" id="sequencerGrid"></div>
    </div>

    <!-- 3단계: 가변형 타임라인 -->
    <div class="timeline-area">
        <div class="section-title" style="margin-top:0;">3단계: 마디별 트랙 패턴 조립</div>
        <div class="timeline-container" id="songTimeline"></div>
        <div>
            <button class="bar-control-btn add-bar" id="addBarBtn">+ 마디 추가</button>
            <button class="bar-control-btn remove-bar" id="removeBarBtn">- 마지막 마디 삭제</button>
        </div>
    </div>

    <!-- 제어 버튼 -->
    <div class="controls">
        <div class="btn-group">
            <button class="main-btn play-btn" id="playBtn">전체 재생</button>
            <button class="main-btn wav-btn" id="saveWavBtn">WAV 다운로드</button>
            <button class="main-btn midi-btn" id="saveMidiBtn">MIDI 파일 저장</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'MULTI_TRACK_COMPOSER_2026';
        const MIDI_NOTES = [72, 71, 69, 67, 65, 64, 62, 60]; 
        const FREQUENCIES = [523.25, 493.88, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63]; 
        const ROWS = FREQUENCIES.length; 
        const COLS = 16; 
        const NUM_PATTERNS = 8;
        const TRACK_COLORS = ['#ff5722', '#e91e63', '#9c27b0', '#00bcd4', '#4caf50', '#ff9800'];

        let tracks = [];
        let currentTrackIdx = 0;
        let currentPatternIdx = 0;
        let patternNames = Array(NUM_PATTERNS).fill().map((_, i) => `패턴 ${i + 1}`);
        let songTimelineState = []; // 각 트랙의 마디별 패턴 인덱스 배열
        let totalBars = 4;
        let currentBPM = 120;
        let undoStack = [];
        const MAX_UNDO = 20;
        let copiedPatternData = null;
        let audioCtx = null, isPlaying = false, intervalId = null, currentTimelineStep = 0, mediaRecorder, audioChunks = [], dest;

        function createEmptyPatternBank() {
            return Array(NUM_PATTERNS).fill().map(() => Array(ROWS).fill().map(() => Array(COLS).fill(false)));
        }

        function initDefaultData() {
            tracks = [
                { name: '트랙 1 (피아노)', instrument: 'triangle', color: TRACK_COLORS[0], patterns: createEmptyPatternBank() },
                { name: '트랙 2 (보컬/휘슬)', instrument: 'sine', color: TRACK_COLORS[1], patterns: createEmptyPatternBank() },
                { name: '트랙 3 (베이스)', instrument: 'square', color: TRACK_COLORS[2], patterns: createEmptyPatternBank() }
            ];
            totalBars = 4;
            songTimelineState = tracks.map(() => Array(totalBars).fill(0));
            currentTrackIdx = 0;
            currentPatternIdx = 0;
            currentBPM = 120;
            undoStack = [];
        }

        function calculateTotalDuration() {
            const totalBeats = totalBars * 4;
            const totalSeconds = Math.round((60 / currentBPM) * totalBeats);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            document.getElementById('totalDurationDisplay').textContent = `⏱️ 총 길이: ${minutes}분 ${seconds}초 (${totalBars}마디)`;
        }

        function saveToLocalStorage() {
            const packed = { tracks, patternNames, songTimelineState, totalBars, currentBPM };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(packed));
            calculateTotalDuration();
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) { initDefaultData(); return; }
            try {
                const parsed = JSON.parse(raw);
                tracks = parsed.tracks;
                patternNames = parsed.patternNames;
                songTimelineState = parsed.songTimelineState;
                totalBars = parsed.totalBars || 4;
                currentBPM = parsed.currentBPM || 120;
                currentTrackIdx = 0;
                currentPatternIdx = 0;
            } catch(e) {
                initDefaultData();
            }
        }

        function startApplication() {
            loadFromLocalStorage();
            document.getElementById('bpmSlider').value = currentBPM;
            document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
            
            setupEventListeners();
            renderTrackList();
            drawPatternManager();
            drawGrid();
            drawTimelineUI();
            calculateTotalDuration();
        }

        function setupEventListeners() {
            document.getElementById('addTrackBtn').addEventListener('click', () => {
                if(tracks.length >= 6) return alert("최대 6개 트랙까지 추가할 수 있습니다.");
                const color = TRACK_COLORS[tracks.length % TRACK_COLORS.length];
                tracks.push({
                    name: `트랙 ${tracks.length + 1}`,
                    instrument: 'triangle',
                    color: color,
                    patterns: createEmptyPatternBank()
                });
                songTimelineState.push(Array(totalBars).fill(0));
                renderTrackList();
                drawTimelineUI();
                saveToLocalStorage();
            });

            document.getElementById('undoBtn').addEventListener('click', () => {
                if (undoStack.length === 0) return;
                const previousState = undoStack.pop();
                tracks[previousState.trackIdx].patterns[previousState.patternIdx] = previousState.gridData;
                currentTrackIdx = previousState.trackIdx;
                currentPatternIdx = previousState.patternIdx;
                renderTrackList(); drawPatternManager(); drawGrid(); saveToLocalStorage();
                document.getElementById('undoBtn').disabled = (undoStack.length === 0);
            });

            document.getElementById('addBarBtn').addEventListener('click', () => {
                totalBars++;
                tracks.forEach((_, tIdx) => songTimelineState[tIdx].push(0));
                drawTimelineUI(); saveToLocalStorage();
            });

            document.getElementById('removeBarBtn').addEventListener('click', () => {
                if (totalBars > 1) {
                    totalBars--;
                    tracks.forEach((_, tIdx) => songTimelineState[tIdx].pop());
                    drawTimelineUI(); saveToLocalStorage();
                }
            });

            document.getElementById('copyPatternBtn').addEventListener('click', () => {
                copiedPatternData = tracks[currentTrackIdx].patterns[currentPatternIdx].map(row => [...row]);
                alert("패턴 복사 완료!");
            });

            document.getElementById('pastePatternBtn').addEventListener('click', () => {
                if (!copiedPatternData) return alert("복사된 데이터가 없습니다.");
                saveUndoState();
                tracks[currentTrackIdx].patterns[currentPatternIdx] = copiedPatternData.map(row => [...row]);
                drawGrid(); saveToLocalStorage();
            });

            document.getElementById('bpmSlider').addEventListener('input', (e) => {
                currentBPM = parseInt(e.target.value);
                document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
                saveToLocalStorage();
            });

            document.getElementById('playBtn').addEventListener('click', togglePlayback);
            document.getElementById('saveWavBtn').addEventListener('click', downloadWavRecording);
            document.getElementById('saveMidiBtn').addEventListener('click', generateMidiExport);
        }

        function saveUndoState() {
            const snapShot = {
                trackIdx: currentTrackIdx,
                patternIdx: currentPatternIdx,
                gridData: tracks[currentTrackIdx].patterns[currentPatternIdx].map(row => [...row])
            };
            undoStack.push(snapShot);
            if (undoStack.length > MAX_UNDO) undoStack.shift();
            document.getElementById('undoBtn').disabled = false;
        }

        function renderTrackList() {
            const container = document.getElementById('trackListContainer');
            container.innerHTML = '';
            tracks.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = `track-item ${idx === currentTrackIdx ? 'active' : ''}`;
                item.style.borderLeftColor = track.color;

                item.innerHTML = `
                    <div class="track-info">
                        <input type="text" class="track-name-input" value="${track.name}" onchange="updateTrackName(${idx}, this.value)">
                        <select class="sound-select" onchange="updateTrackInstrument(${idx}, this.value)">
                            <option value="triangle" ${track.instrument === 'triangle' ? 'selected' : ''}>🎹 피아노 (Triangle)</option>
                            <option value="sawtooth" ${track.instrument === 'sawtooth' ? 'selected' : ''}>🎸 신시사이저 (Saw)</option>
                            <option value="sine" ${track.instrument === 'sine' ? 'selected' : ''}>🎷 플루트/보컬 (Sine)</option>
                            <option value="square" ${track.instrument === 'square' ? 'selected' : ''}>🎻 베이스 (Square)</option>
                            <option value="noise" ${track.instrument === 'noise' ? 'selected' : ''}>🥁 노이즈 드럼 (Perc)</option>
                        </select>
                    </div>
                    <div>
                        <button class="track-btn select-track-btn" onclick="selectTrack(${idx})">${idx === currentTrackIdx ? '편집 중' : '트랙 선택'}</button>
                        ${tracks.length > 1 ? `<button class="track-btn delete-track-btn" onclick="deleteTrack(${idx})">삭제</button>` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function updateTrackName(idx, val) { tracks[idx].name = val; drawTimelineUI(); saveToLocalStorage(); }
        function updateTrackInstrument(idx, val) { tracks[idx].instrument = val; saveToLocalStorage(); }
        
        function selectTrack(idx) {
            currentTrackIdx = idx;
            renderTrackList();
            drawGrid();
        }

        function deleteTrack(idx) {
            if (tracks.length <= 1) return;
            tracks.splice(idx, 1);
            songTimelineState.splice(idx, 1);
            if (currentTrackIdx >= tracks.length) currentTrackIdx = tracks.length - 1;
            renderTrackList(); drawGrid(); drawTimelineUI(); saveToLocalStorage();
        }

        function drawPatternManager() {
            const pManager = document.getElementById('patternManagerContainer');
            pManager.innerHTML = '';
            for (let i = 0; i < NUM_PATTERNS; i++) {
                const item = document.createElement('div');
                item.className = `pattern-item ${i === currentPatternIdx ? 'active' : ''}`;
                item.innerHTML = `
                    <button class="p-select-btn" onclick="selectPattern(${i})">P${i + 1}</button>
                    <input type="text" class="p-name-input" value="${patternNames[i]}" oninput="updatePatternName(${i}, this.value)">
                `;
                pManager.appendChild(item);
            }
        }

        function selectPattern(i) { currentPatternIdx = i; drawPatternManager(); drawGrid(); }
        function updatePatternName(i, val) { patternNames[i] = val || `패턴 ${i + 1}`; drawTimelineUI(); saveToLocalStorage(); }

        function drawGrid() {
            const gridContainer = document.getElementById('sequencerGrid');
            gridContainer.innerHTML = ''; 
            const currentGrid = tracks[currentTrackIdx].patterns[currentPatternIdx];
            const activeColor = tracks[currentTrackIdx].color;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const btn = document.createElement('button');
                    btn.className = 'note-btn'; btn.id = `btn-${r}-${c}`;
                    if (currentGrid[r][c]) {
                        btn.classList.add('on');
                        btn.style.backgroundColor = activeColor;
                        btn.style.boxShadow = `0 0 6px ${activeColor}`;
                    }
                    btn.addEventListener('click', () => {
                        saveUndoState();
                        currentGrid[r][c] = !currentGrid[r][c];
                        drawGrid();
                        saveToLocalStorage();
                    });
                    gridContainer.appendChild(btn);
                }
            }
        }

        function drawTimelineUI() {
            const timelineContainer = document.getElementById('songTimeline');
            timelineContainer.innerHTML = '';

            for (let b = 0; b < totalBars; b++) {
                const block = document.createElement('div');
                block.className = 'timeline-block'; block.id = `bar-${b}`;
                block.innerHTML = `<div class="timeline-label">${b+1}마디</div>`;
                
                tracks.forEach((track, tIdx) => {
                    const select = document.createElement('select');
                    select.style.borderLeft = `4px solid ${track.color}`;
                    for(let p = 0; p < NUM_PATTERNS; p++) {
                        const opt = document.createElement('option'); opt.value = p; opt.textContent = `${track.name}: P${p+1}`;
                        if(songTimelineState[tIdx] && songTimelineState[tIdx][b] === p) opt.selected = true;
                        select.appendChild(opt);
                    }
                    select.addEventListener('change', (e) => {
                        songTimelineState[tIdx][b] = parseInt(e.target.value);
                        saveToLocalStorage();
                    });
                    block.appendChild(select);
                });
                timelineContainer.appendChild(block);
            }
        }

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
            mediaRecorder = new MediaRecorder(dest.stream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'multi-track-music.wav'; a.click();
                audioChunks = [];
            };
        }

        function playTone(freq, type = 'triangle') {
            if (!audioCtx) return;
            if (type === 'noise') {
                // 노이즈 타악기 사운드 생성
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                whiteNoise.connect(gain); gain.connect(audioCtx.destination); gain.connect(dest);
                whiteNoise.start();
                return;
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; 
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); gain.connect(dest);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function togglePlayback() {
            if (!audioCtx) initAudio();
            if (isPlaying) {
                clearTimeout(intervalId);
                if(mediaRecorder.state === "recording") mediaRecorder.stop();
                isPlaying = false;
                document.getElementById('playBtn').textContent = "전체 재생";
                document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('playing'));
                document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('current'));
            } else {
                currentTimelineStep = 0; mediaRecorder.start(); isPlaying = true; runSongSequencer();
                document.getElementById('playBtn').textContent = "정지";
            }
        }

        function getStepDurationMs(bpm) { return (60000 / bpm) / 4; }

        function runSongSequencer() {
            function nextStep() {
                if (!isPlaying) return;
                const currentBar = Math.floor(currentTimelineStep / COLS);
                const currentStepInBar = currentTimelineStep % COLS;

                document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('current'));
                const activeBarBlock = document.getElementById(`bar-${currentBar}`);
                if(activeBarBlock) activeBarBlock.classList.add('current');

                const prevStepInBar = (currentStepInBar - 1 + COLS) % COLS;

                for (let r = 0; r < ROWS; r++) {
                    const pBtn = document.getElementById(`btn-${r}-${prevStepInBar}`);
                    if(pBtn) pBtn.classList.remove('playing');

                    const cBtn = document.getElementById(`btn-${r}-${currentStepInBar}`);
                    if(cBtn) cBtn.classList.add('playing');

                    tracks.forEach((track, tIdx) => {
                        const patternIdx = songTimelineState[tIdx][currentBar];
                        if (track.patterns[patternIdx][r][currentStepInBar]) {
                            playTone(FREQUENCIES[r], track.instrument);
                        }
                    });
                }
                currentTimelineStep = (currentTimelineStep + 1) % (totalBars * COLS);
                intervalId = setTimeout(nextStep, getStepDurationMs(currentBPM));
            }
            nextStep();
        }

        function downloadWavRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop(); clearTimeout(intervalId); isPlaying = false;
                document.getElementById('playBtn').textContent = "전체 재생";
                document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('playing'));
                document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('current'));
            } else { alert("연주 중일 때만 저장이 가능합니다. 전체 재생을 실행해 주세요."); }
        }

        function generateMidiExport() {
            const midiHeader = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x60];
            let trackEvents = []; const tickPerStep = 48; 
            
            for (let b = 0; b < totalBars; b++) {
                for (let c = 0; c < COLS; c++) {
                    const absoluteStep = (b * COLS) + c; const absoluteTick = absoluteStep * tickPerStep;
                    tracks.forEach((track, tIdx) => {
                        const patternIdx = songTimelineState[tIdx][b];
                        for (let r = 0; r < ROWS; r++) {
                            if (track.patterns[patternIdx][r][c]) {
                                const note = MIDI_NOTES[r];
                                trackEvents.push({ tick: absoluteTick, type: 0x90 + tIdx, note: note, vel: 100 }); 
                                trackEvents.push({ tick: absoluteTick + 40, type: 0x80 + tIdx, note: note, vel: 0 });  
                            }
                        }
                    });
                }
            }
            trackEvents.sort((a, b) => a.tick - b.tick);
            function writeVarInt(value) {
                let buffer = []; if (value === 0) return [0];
                while (value > 0) { buffer.push(value & 0x7F); value >>= 7; }
                buffer.reverse();
                for (let i = 0; i < buffer.length - 1; i++) buffer[i] |= 0x80;
                return buffer;
            }
            let trackData = []; let currentTick = 0;
            trackEvents.forEach(evt => {
                let deltaTime = evt.tick - currentTick; currentTick = evt.tick;
                trackData.push(...writeVarInt(deltaTime)); trackData.push(evt.type, evt.note, evt.vel);
            });
            trackData.push(0x00, 0xFF, 0x2F, 0x00);
            const len = trackData.length;
            const midiTrackHeader = [0x4d, 0x54, 0x72, 0x6b, (len >> 24) & 0xFF, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF];
            const finalMidiBlob = new Uint8Array([...midiHeader, ...midiTrackHeader, ...trackData]);
            const blob = new Blob([finalMidiBlob], { type: "audio/midi" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = "multitrack-composition.mid"; a.click();
        }

        window.onload = startApplication;
    </script>
