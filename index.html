<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커스텀 악기 지원 멀티 트랙 작곡 프로그램</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1b1b1b; color: #fff; padding: 15px; margin: 0; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; color: #fff; }
        .section-title { font-size: 1rem; color: #00adb5; margin-top: 20px; font-weight: bold; }
        
        .global-status-bar { background: #111; padding: 12px; margin: 10px auto; max-width: 95%; border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
        .bpm-container { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .bpm-slider { width: 130px; cursor: pointer; }
        .bpm-display { color: #ffc107; font-size: 1.1rem; min-width: 65px; }
        .duration-display { background: #222; border: 1px solid #00adb5; color: #00adb5; padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
        
        .track-control-panel { background: #2a2a2a; padding: 15px; border-radius: 10px; max-width: 95%; margin: 15px auto; text-align: left; }
        .track-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .track-item { display: flex; align-items: center; justify-content: space-between; background: #333; padding: 10px 15px; border-radius: 6px; border-left: 6px solid #888; flex-wrap: wrap; gap: 10px; }
        .track-item.active { background: #3a3f44; }
        .track-info { display: flex; align-items: center; gap: 12px; font-weight: bold; flex-wrap: wrap; }
        .track-name-input { background: #222; color: #fff; border: 1px solid #555; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem; width: 110px; }
        .sound-select { background: #222; color: #ffc107; border: 1px solid #00adb5; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }
        
        .custom-file-area { display: inline-flex; align-items: center; gap: 6px; }
        .custom-file-btn { background: #17a2b8; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .sample-status { font-size: 0.75rem; color: #ffc107; }

        .volume-container { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: #ccc; }
        .volume-slider { width: 80px; cursor: pointer; }
        .volume-display { font-size: 0.8rem; color: #ffc107; min-width: 35px; }

        .track-btn { padding: 6px 12px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; }
        .select-track-btn { background: #00adb5; color: white; }
        .delete-track-btn { background: #dc3545; color: white; }

        .pattern-manager { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 95%; margin: 10px auto; background: #2a2a2a; padding: 12px; border-radius: 10px; min-height: 50px; }
        .pattern-item { display: flex; flex-direction: column; align-items: center; background: #333; padding: 6px; border-radius: 6px; border: 1px solid #444; width: 90px; }
        .pattern-item.active { border-color: #00adb5; background: #243536; }
        .p-select-btn { width: 100%; padding: 5px 0; font-weight: bold; background: #444; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px; font-size: 0.8rem; }
        .pattern-item.active .p-select-btn { background: #00adb5; }
        .p-name-input { width: 90%; font-size: 0.7rem; padding: 2px; border: 1px solid #555; background: #222; color: #fff; text-align: center; border-radius: 3px; box-sizing: border-box; }

        .util-bar { margin: 10px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; align-items: center; }
        .util-btn { padding: 6px 14px; font-size: 0.85rem; background: #4f5b66; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        .tie-toggle-btn { background: #555; color: #ccc; border: 2px solid #777; transition: all 0.2s; }
        .tie-toggle-btn.active { background: #ff9800; color: #000; border-color: #fff; font-weight: bold; box-shadow: 0 0 8px #ff9800; }

        .undo-btn { background: #dc3545; color: white; }
        .undo-btn:disabled { background: #444; color: #777; cursor: not-allowed; }
        .new-project-btn { background: #6f42c1; color: white; }
        .file-io-btn { background: #007bff; color: white; }

        .grid-viewport { overflow-x: auto; background: #1a1a1a; border-radius: 12px; padding: 15px 10px; margin: 10px auto; max-width: 98%; }
        .grid { display: grid; grid-template-columns: repeat(16, 36px); gap: 10px 8px; justify-content: start; width: max-content; }
        .note-btn { width: 36px !important; height: 45px !important; min-width: 36px; box-sizing: border-box; background: #444; border: 2px solid transparent; border-radius: 6px; cursor: pointer; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; }
        
        .note-btn.on { background: #00adb5; box-shadow: 0 0 6px #00adb5; }
        .note-btn.on.tie { background: #ff9800 !important; color: #111 !important; font-weight: bold; box-shadow: 0 0 8px #ff9800 !important; }
        
        .note-btn.playing { border-color: #fff; filter: brightness(1.3); }
        .note-btn.on.playing { border-color: #fff; filter: brightness(1.6); }

        .timeline-area { background: #2a2a2a; padding: 15px; border-radius: 12px; max-width: 95%; margin: 15px auto; }
        .timeline-container { display: flex; gap: 8px; justify-content: flex-start; margin: 15px 0; overflow-x: auto; padding-bottom: 10px; }
        .timeline-block { background: #333; border: 2px solid #555; border-radius: 6px; padding: 8px; width: 125px; text-align: center; flex-shrink: 0; }
        .timeline-block.current { border-color: #ffc107; background: #443c25; }
        .timeline-label { font-size: 0.8rem; font-weight: bold; margin-bottom: 6px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .timeline-block select { background: #222; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 2px; width: 100%; cursor: pointer; font-size: 0.75rem; margin-bottom: 4px; }
        
        .play-bar-btn { background: #28a745; color: white; border: none; border-radius: 3px; padding: 2px 6px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }
        .play-bar-btn.playing { background: #dc3545; }

        .bar-control-btn { padding: 6px 14px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; margin: 0 5px; }
        .add-bar { background: #00adb5; color: white; }
        .remove-bar { background: #6c757d; color: white; }

        .controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button.main-btn { padding: 12px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; min-width: 130px; }
        .play-btn { background: #28a745; color: white; }
        .record-btn { background: #dc3545; color: white; }
        .record-btn.recording { background: #ff9800; animation: blink 1s infinite; }
        .midi-btn { background: #007bff; color: white; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <h1>🎼 커스텀 악기 지원 멀티 트랙 작곡 프로그램</h1>

    <div class="global-status-bar">
        <div class="bpm-container">
            <span>속도 (BPM):</span>
            <input type="range" id="bpmSlider" class="bpm-slider" min="60" max="200" value="120">
            <span id="bpmDisplay" class="bpm-display">120 BPM</span>
        </div>
        <div class="duration-display" id="totalDurationDisplay">⏱️ 총 길이: 0분 0초</div>
    </div>

    <div class="track-control-panel">
        <div class="section-title" style="margin-top:0;">1단계: 트랙 악기 및 커스텀 음원 파일 설정</div>
        <div class="track-list" id="trackListContainer"></div>
        <button class="track-btn select-track-btn" id="addTrackBtn">+ 새 트랙 추가</button>
    </div>
    
    <div class="section-title">2단계: 현재 트랙의 패턴 선택 및 수정</div>
    <div class="pattern-manager" id="patternManagerContainer"></div>

    <div class="util-bar">
        <button class="util-btn tie-toggle-btn" id="tieModeBtn">🔗 이음줄(Tie) 입력: OFF</button>
        <button class="util-btn undo-btn" id="undoBtn" disabled>↩ 되돌리기</button>
        <button class="util-btn" id="copyPatternBtn">패턴 복사</button>
        <button class="util-btn" id="pastePatternBtn">붙여넣기</button>
        <button class="util-btn new-project-btn" id="newProjectBtn">✨ 새로 만들기</button>
        <button class="util-btn file-io-btn" id="exportJsonBtn">💾 저장 (.json)</button>
        <button class="util-btn file-io-btn" id="importJsonBtn" onclick="document.getElementById('hiddenFileInput').click()">📁 불러오기</button>
        <input type="file" id="hiddenFileInput" accept=".json" style="display: none;">
    </div>

    <div class="grid-viewport">
        <div class="grid" id="sequencerGrid"></div>
    </div>

    <div class="timeline-area">
        <div class="section-title" style="margin-top:0;">3단계: 마디별 트랙 패턴 조립 및 부분 재생</div>
        <div class="timeline-container" id="songTimeline"></div>
        <div>
            <button class="bar-control-btn add-bar" id="addBarBtn">+ 마디 추가</button>
            <button class="bar-control-btn remove-bar" id="removeBarBtn">- 마지막 마디 삭제</button>
        </div>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button class="main-btn play-btn" id="playBtn">전체 재생</button>
            <button class="main-btn record-btn" id="recordBtn">🔴 녹음 시작 (WAV)</button>
            <button class="main-btn midi-btn" id="saveMidiBtn">MIDI 파일 저장</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'MULTI_TRACK_COMPOSER_CUSTOM_SAMPLE_2026';
        const MIDI_NOTES = [72, 71, 69, 67, 65, 64, 62, 60]; 
        const FREQUENCIES = [523.25, 493.88, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63]; 
        const BASE_FREQ = 261.63; 
        const ROWS = FREQUENCIES.length; 
        const COLS = 16; 
        const NUM_PATTERNS = 8;
        const TRACK_COLORS = ['#00adb5', '#e91e63', '#9c27b0', '#00bcd4', '#4caf50', '#ff5722'];

        let tracks = [];
        let currentTrackIdx = 0;
        let currentPatternIdx = 0;
        let patternNames = Array(NUM_PATTERNS).fill().map((_, i) => `패턴 ${i + 1}`);
        let songTimelineState = []; 
        let totalBars = 4;
        let currentBPM = 120;
        let undoStack = [];
        const MAX_UNDO = 20;
        let copiedPatternData = null;
        let isTieMode = false;

        let audioCtx = null, isPlaying = false, intervalId = null, currentTimelineStep = 0, mediaRecorder = null, audioChunks = [], dest = null;
        let isRecording = false;
        let playingBarMode = -1; // -1: 전체재생, 0이상의 숫자: 특정 마디 전용 재생
        let activeNodes = {};

        function createEmptyPatternBank() {
            return Array(NUM_PATTERNS).fill().map(() => 
                Array(ROWS).fill().map(() => 
                    Array(COLS).fill().map(() => ({ on: false, tie: false }))
                )
            );
        }

        function initDefaultData() {
            tracks = [
                { name: '트랙 1 (피아노)', instrument: 'triangle', volume: 80, color: TRACK_COLORS[0], patterns: createEmptyPatternBank(), audioBuffer: null, sampleName: '' },
                { name: '트랙 2 (보컬/휘슬)', instrument: 'sine', volume: 80, color: TRACK_COLORS[1], patterns: createEmptyPatternBank(), audioBuffer: null, sampleName: '' },
                { name: '트랙 3 (베이스)', instrument: 'square', volume: 70, color: TRACK_COLORS[2], patterns: createEmptyPatternBank(), audioBuffer: null, sampleName: '' }
            ];
            totalBars = 4;
            patternNames = Array(NUM_PATTERNS).fill().map((_, i) => `패턴 ${i + 1}`);
            songTimelineState = tracks.map(() => Array(totalBars).fill(0));
            currentTrackIdx = 0;
            currentPatternIdx = 0;
            currentBPM = 120;
            undoStack = [];
        }

        function calculateTotalDuration() {
            const totalBeats = totalBars * 4;
            const totalSeconds = Math.round((60 / currentBPM) * totalBeats);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            document.getElementById('totalDurationDisplay').textContent = `⏱️ 총 길이: ${minutes}분 ${seconds}초 (${totalBars}마디)`;
        }

        function saveToLocalStorage() {
            const saveTracks = tracks.map(t => ({
                name: t.name,
                instrument: t.instrument,
                volume: t.volume,
                color: t.color,
                patterns: t.patterns,
                sampleName: t.sampleName
            }));
            const packed = { tracks: saveTracks, patternNames, songTimelineState, totalBars, currentBPM };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(packed));
            calculateTotalDuration();
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) { initDefaultData(); return; }
            try {
                const parsed = JSON.parse(raw);
                tracks = parsed.tracks;
                tracks.forEach(t => {
                    if (t.volume === undefined) t.volume = 80;
                    if (!t.audioBuffer) t.audioBuffer = null;
                    if (!t.sampleName) t.sampleName = '';
                    t.patterns.forEach(p => {
                        for(let r=0; r<ROWS; r++){
                            for(let c=0; c<COLS; c++){
                                if(typeof p[r][c] === 'boolean'){
                                    p[r][c] = { on: p[r][c], tie: false };
                                }
                            }
                        }
                    });
                });
                patternNames = parsed.patternNames;
                songTimelineState = parsed.songTimelineState;
                totalBars = parsed.totalBars || 4;
                currentBPM = parsed.currentBPM || 120;
                currentTrackIdx = 0;
                currentPatternIdx = 0;
            } catch(e) {
                initDefaultData();
            }
        }

        function startApplication() {
            loadFromLocalStorage();
            document.getElementById('bpmSlider').value = currentBPM;
            document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
            
            setupEventListeners();
            renderTrackList();
            drawPatternManager();
            drawGrid();
            drawTimelineUI();
            calculateTotalDuration();
        }

        function setupEventListeners() {
            document.getElementById('tieModeBtn').addEventListener('click', () => {
                isTieMode = !isTieMode;
                const btn = document.getElementById('tieModeBtn');
                if (isTieMode) {
                    btn.classList.add('active');
                    btn.textContent = '🔗 이음줄(Tie) 입력: ON';
                } else {
                    btn.classList.remove('active');
                    btn.textContent = '🔗 이음줄(Tie) 입력: OFF';
                }
            });

            document.getElementById('exportJsonBtn').addEventListener('click', () => {
                const saveTracks = tracks.map(t => ({
                    name: t.name,
                    instrument: t.instrument,
                    volume: t.volume,
                    color: t.color,
                    patterns: t.patterns,
                    sampleName: t.sampleName
                }));
                const dataStr = JSON.stringify({ version: "2026.custom_sampler", currentBPM, totalBars, patternNames, songTimelineState, tracks: saveTracks }, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.download = `project_${new Date().getTime()}.json`;
                a.href = url; a.click(); URL.revokeObjectURL(url);
            });

            document.getElementById('hiddenFileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        if(!parsed.tracks) throw new Error("올바른 파일이 아닙니다.");
                        if(isPlaying) stopPlayback();

                        tracks = parsed.tracks;
                        tracks.forEach(t => { t.audioBuffer = null; });
                        songTimelineState = parsed.songTimelineState;
                        patternNames = parsed.patternNames;
                        totalBars = parsed.totalBars || 4;
                        currentBPM = parsed.currentBPM || 120;
                        currentTrackIdx = 0; currentPatternIdx = 0; undoStack = [];

                        document.getElementById('bpmSlider').value = currentBPM;
                        document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;

                        renderTrackList(); drawPatternManager(); drawGrid(); drawTimelineUI(); saveToLocalStorage();
                        alert("📁 프로젝트를 정상적으로 불러왔습니다!");
                    } catch(err) { alert("로드 에러: " + err.message); }
                    e.target.value = '';
                };
                reader.readAsText(file);
            });

            document.getElementById('newProjectBtn').addEventListener('click', () => {
                if(confirm("초기화하시겠습니까?")) {
                    if(isPlaying) stopPlayback();
                    initDefaultData();
                    document.getElementById('bpmSlider').value = currentBPM;
                    document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
                    renderTrackList(); drawPatternManager(); drawGrid(); drawTimelineUI(); saveToLocalStorage();
                }
            });

            document.getElementById('addTrackBtn').addEventListener('click', () => {
                if(tracks.length >= 6) return alert("최대 6개 트랙까지 가능합니다.");
                const color = TRACK_COLORS[tracks.length % TRACK_COLORS.length];
                tracks.push({
                    name: `트랙 ${tracks.length + 1}`,
                    instrument: 'triangle',
                    volume: 80,
                    color: color,
                    patterns: createEmptyPatternBank(),
                    audioBuffer: null,
                    sampleName: ''
                });
                songTimelineState.push(Array(totalBars).fill(0));
                renderTrackList(); drawTimelineUI(); saveToLocalStorage();
            });

            document.getElementById('undoBtn').addEventListener('click', () => {
                if (undoStack.length === 0) return;
                const previousState = undoStack.pop();
                tracks[previousState.trackIdx].patterns[previousState.patternIdx] = previousState.gridData;
                currentTrackIdx = previousState.trackIdx;
                currentPatternIdx = previousState.patternIdx;
                renderTrackList(); drawPatternManager(); drawGrid(); saveToLocalStorage();
                document.getElementById('undoBtn').disabled = (undoStack.length === 0);
            });

            document.getElementById('addBarBtn').addEventListener('click', () => {
                totalBars++;
                tracks.forEach((_, tIdx) => songTimelineState[tIdx].push(0));
                drawTimelineUI(); saveToLocalStorage();
            });

            document.getElementById('removeBarBtn').addEventListener('click', () => {
                if (totalBars > 1) {
                    totalBars--;
                    tracks.forEach((_, tIdx) => songTimelineState[tIdx].pop());
                    drawTimelineUI(); saveToLocalStorage();
                }
            });

            document.getElementById('copyPatternBtn').addEventListener('click', () => {
                copiedPatternData = tracks[currentTrackIdx].patterns[currentPatternIdx].map(row => row.map(cell => ({...cell})));
                alert("패턴 복사 완료!");
            });

            document.getElementById('pastePatternBtn').addEventListener('click', () => {
                if (!copiedPatternData) return alert("복사된 데이터가 없습니다.");
                saveUndoState();
                tracks[currentTrackIdx].patterns[currentPatternIdx] = copiedPatternData.map(row => row.map(cell => ({...cell})));
                drawGrid(); saveToLocalStorage();
            });

            document.getElementById('bpmSlider').addEventListener('input', (e) => {
                currentBPM = parseInt(e.target.value);
                document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
                saveToLocalStorage();
            });

            document.getElementById('playBtn').addEventListener('click', () => {
                if(isPlaying && playingBarMode === -1) {
                    stopPlayback();
                } else {
                    startPlayback(-1);
                }
            });

            document.getElementById('recordBtn').addEventListener('click', toggleRecording);
            document.getElementById('saveMidiBtn').addEventListener('click', generateMidiExport);
        }

        function saveUndoState() {
            const snapShot = {
                trackIdx: currentTrackIdx,
                patternIdx: currentPatternIdx,
                gridData: tracks[currentTrackIdx].patterns[currentPatternIdx].map(row => row.map(cell => ({...cell})))
            };
            undoStack.push(snapShot);
            if (undoStack.length > MAX_UNDO) undoStack.shift();
            document.getElementById('undoBtn').disabled = false;
        }

        function loadCustomAudioFile(trackIdx, event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
                    tracks[trackIdx].audioBuffer = buffer;
                    tracks[trackIdx].sampleName = file.name;
                    tracks[trackIdx].instrument = 'custom';
                    renderTrackList();
                    saveToLocalStorage();
                    alert(`'${file.name}' 소리가 ${tracks[trackIdx].name} 악기로 등록되었습니다!`);
                }, (err) => {
                    alert("오디오 파일을 디코딩하는데 실패했습니다.");
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function renderTrackList() {
            const container = document.getElementById('trackListContainer');
            container.innerHTML = '';
            tracks.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = `track-item ${idx === currentTrackIdx ? 'active' : ''}`;
                item.style.borderLeftColor = track.color;

                const isCustom = track.instrument === 'custom';

                item.innerHTML = `
                    <div class="track-info">
                        <input type="text" class="track-name-input" value="${track.name}" onchange="updateTrackName(${idx}, this.value)">
                        <select class="sound-select" onchange="updateTrackInstrument(${idx}, this.value)">
                            <option value="triangle" ${track.instrument === 'triangle' ? 'selected' : ''}>🎹 피아노 (Triangle)</option>
                            <option value="sawtooth" ${track.instrument === 'sawtooth' ? 'selected' : ''}>🎸 신시사이저 (Saw)</option>
                            <option value="sine" ${track.instrument === 'sine' ? 'selected' : ''}>🎷 플루트/보컬 (Sine)</option>
                            <option value="square" ${track.instrument === 'square' ? 'selected' : ''}>🎻 베이스 (Square)</option>
                            <option value="noise" ${track.instrument === 'noise' ? 'selected' : ''}>🥁 노이즈 드럼 (Perc)</option>
                            <option value="custom" ${isCustom ? 'selected' : ''}>🎙️ 커스텀 샘플 파일</option>
                        </select>

                        ${isCustom ? `
                            <div class="custom-file-area">
                                <button class="custom-file-btn" onclick="document.getElementById('sampleInput-${idx}').click()">📂 소리 파일 선택</button>
                                <input type="file" id="sampleInput-${idx}" accept="audio/*" style="display:none;" onchange="loadCustomAudioFile(${idx}, event)">
                                <span class="sample-status">${track.sampleName ? '🎧 ' + track.sampleName : '(파일을 선택해주세요)'}</span>
                            </div>
                        ` : ''}

                        <div class="volume-container">
                            <span>🔊</span>
                            <input type="range" class="volume-slider" min="0" max="100" value="${track.volume}" oninput="updateTrackVolume(${idx}, this.value)">
                            <span class="volume-display" id="vol-disp-${idx}">${track.volume}%</span>
                        </div>
                    </div>
                    <div>
                        <button class="track-btn select-track-btn" onclick="selectTrack(${idx})">${idx === currentTrackIdx ? '편집 중' : '트랙 선택'}</button>
                        ${tracks.length > 1 ? `<button class="track-btn delete-track-btn" onclick="deleteTrack(${idx})">삭제</button>` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function updateTrackName(idx, val) { tracks[idx].name = val; drawTimelineUI(); saveToLocalStorage(); }
        
        function updateTrackInstrument(idx, val) { 
            tracks[idx].instrument = val; 
            renderTrackList();
            
            if (val === 'custom' && !tracks[idx].audioBuffer) {
                setTimeout(() => {
                    const fileInput = document.getElementById(`sampleInput-${idx}`);
                    if (fileInput) fileInput.click();
                }, 50);
            }
            saveToLocalStorage(); 
        }

        function updateTrackVolume(idx, val) {
            tracks[idx].volume = parseInt(val);
            const disp = document.getElementById(`vol-disp-${idx}`);
            if (disp) disp.textContent = `${val}%`;
            saveToLocalStorage();
        }
        function selectTrack(idx) { currentTrackIdx = idx; renderTrackList(); drawGrid(); }
        function deleteTrack(idx) {
            if (tracks.length <= 1) return;
            tracks.splice(idx, 1);
            songTimelineState.splice(idx, 1);
            if (currentTrackIdx >= tracks.length) currentTrackIdx = tracks.length - 1;
            renderTrackList(); drawGrid(); drawTimelineUI(); saveToLocalStorage();
        }

        function drawPatternManager() {
            const pManager = document.getElementById('patternManagerContainer');
            pManager.innerHTML = '';
            for (let i = 0; i < NUM_PATTERNS; i++) {
                const item = document.createElement('div');
                item.className = `pattern-item ${i === currentPatternIdx ? 'active' : ''}`;
                item.innerHTML = `
                    <button class="p-select-btn" onclick="selectPattern(${i})">P${i + 1}</button>
                    <input type="text" class="p-name-input" value="${patternNames[i]}" oninput="updatePatternName(${i}, this.value)">
                `;
                pManager.appendChild(item);
            }
        }

        function selectPattern(i) { currentPatternIdx = i; drawPatternManager(); drawGrid(); }
        function updatePatternName(i, val) { patternNames[i] = val || `패턴 ${i + 1}`; drawTimelineUI(); saveToLocalStorage(); }

        function drawGrid() {
            const gridContainer = document.getElementById('sequencerGrid');
            gridContainer.innerHTML = ''; 
            const currentGrid = tracks[currentTrackIdx].patterns[currentPatternIdx];
            const activeColor = tracks[currentTrackIdx].color;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const btn = document.createElement('button');
                    btn.className = 'note-btn'; btn.id = `btn-${r}-${c}`;
                    const cell = currentGrid[r][c];

                    if (cell.on) {
                        btn.classList.add('on');
                        if (cell.tie) {
                            btn.classList.add('tie');
                            btn.textContent = '🔗';
                        } else {
                            btn.style.backgroundColor = activeColor;
                            btn.style.boxShadow = `0 0 6px ${activeColor}`;
                        }
                    }

                    btn.addEventListener('click', () => {
                        saveUndoState();

                        if (!cell.on) {
                            cell.on = true;
                            cell.tie = isTieMode;
                        } else {
                            if (isTieMode && !cell.tie) {
                                cell.tie = true;
                            } else {
                                cell.on = false;
                                cell.tie = false;
                            }
                        }

                        if (cell.on) {
                            if (!audioCtx) initAudio();
                            if (audioCtx.state === 'suspended') audioCtx.resume();
                            const noteDuration = (60 / currentBPM) / 4;
                            playTone(FREQUENCIES[r], tracks[currentTrackIdx].instrument, tracks[currentTrackIdx].volume, noteDuration, null, tracks[currentTrackIdx].audioBuffer);
                        }

                        drawGrid();
                        saveToLocalStorage();
                    });
                    gridContainer.appendChild(btn);
                }
            }
        }

        function drawTimelineUI() {
            const timelineContainer = document.getElementById('songTimeline');
            timelineContainer.innerHTML = '';

            for (let b = 0; b < totalBars; b++) {
                const block = document.createElement('div');
                block.className = 'timeline-block'; block.id = `bar-${b}`;
                
                const isThisBarPlaying = isPlaying && playingBarMode === b;

                block.innerHTML = `
                    <div class="timeline-label">
                        <span>${b+1}마디</span>
                        <button class="play-bar-btn ${isThisBarPlaying ? 'playing' : ''}" onclick="toggleBarPlayback(${b})">
                            ${isThisBarPlaying ? '■ 정지' : '▶ 재생'}
                        </button>
                    </div>
                `;
                
                tracks.forEach((track, tIdx) => {
                    const select = document.createElement('select');
                    select.style.borderLeft = `4px solid ${track.color}`;
                    for(let p = 0; p < NUM_PATTERNS; p++) {
                        const opt = document.createElement('option'); opt.value = p; opt.textContent = `${track.name}: P${p+1}`;
                        if(songTimelineState[tIdx] && songTimelineState[tIdx][b] === p) opt.selected = true;
                        select.appendChild(opt);
                    }
                    select.addEventListener('change', (e) => {
                        songTimelineState[tIdx][b] = parseInt(e.target.value);
                        saveToLocalStorage();
                    });
                    block.appendChild(select);
                });
                timelineContainer.appendChild(block);
            }
        }

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
        }

        function toggleRecording() {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const recordBtn = document.getElementById('recordBtn');

            if (!isRecording) {
                // 녹음 시작
                audioChunks = [];
                mediaRecorder = new MediaRecorder(dest.stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/wav' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `composition_${new Date().getTime()}.wav`; a.click();
                    audioChunks = [];
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.textContent = "⏹️ 녹음 중지 & 저장";

                if (!isPlaying) {
                    startPlayback(-1);
                }
            } else {
                // 녹음 중지
                if (mediaRecorder && mediaRecorder.state === "recording") {
                    mediaRecorder.stop();
                }
                isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.textContent = "🔴 녹음 시작 (WAV)";
            }
        }

        function playTone(freq, type = 'triangle', volumePercent = 80, duration = 0.2, key = null, buffer = null) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const now = audioCtx.currentTime;
            const targetGain = (volumePercent / 100) * 0.25;

            if (type === 'custom' && buffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                source.loop = true; 

                const rate = freq / BASE_FREQ;
                source.playbackRate.setValueAtTime(rate, now);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(targetGain, now);
                gain.gain.setValueAtTime(targetGain, now + Math.max(0.01, duration - 0.05));
                gain.gain.linearRampToValueAtTime(0.0001, now + duration);

                source.connect(gain);
                gain.connect(audioCtx.destination);
                if (dest) source.connect(dest);

                source.start(now);
                source.stop(now + duration);
                return { osc: source, gain };
            }

            if (type === 'noise') {
                const bufferSize = audioCtx.sampleRate * Math.min(duration, 0.5);
                const noiseBuf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuf.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuf;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(targetGain, now);
                gain.gain.linearRampToValueAtTime(0.001, now + duration);
                whiteNoise.connect(gain); gain.connect(audioCtx.destination); 
                if (dest) whiteNoise.connect(dest);
                whiteNoise.start(now);
                return null;
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; 
            osc.frequency.setValueAtTime(freq, now);
            
            const fadeOutDuration = 0.05;
            const sustainEndTime = Math.max(now, now + duration - fadeOutDuration);

            gain.gain.setValueAtTime(targetGain, now);
            gain.gain.setValueAtTime(targetGain, sustainEndTime); 
            gain.gain.linearRampToValueAtTime(0.0001, now + duration);
            
            osc.connect(gain); gain.connect(audioCtx.destination); 
            if (dest) osc.connect(dest);
            
            osc.start(now); 
            osc.stop(now + duration);

            return { osc, gain };
        }

        function stopKeyNote(key) {
            if (activeNodes[key]) {
                try {
                    const now = audioCtx.currentTime;
                    activeNodes[key].gain.gain.cancelScheduledValues(now);
                    activeNodes[key].gain.gain.linearRampToValueAtTime(0.0001, now + 0.02);
                    activeNodes[key].osc.stop(now + 0.02);
                } catch(e) {}
                delete activeNodes[key];
            }
        }

        function toggleBarPlayback(barIdx) {
            if (isPlaying && playingBarMode === barIdx) {
                stopPlayback();
            } else {
                startPlayback(barIdx);
            }
        }

        function startPlayback(barMode = -1) {
            if (!audioCtx) initAudio();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) stopPlayback();

            playingBarMode = barMode;
            isPlaying = true;

            if (playingBarMode !== -1) {
                currentTimelineStep = playingBarMode * COLS;
            } else {
                currentTimelineStep = 0;
            }

            document.getElementById('playBtn').textContent = (playingBarMode === -1) ? "정지" : "전체 재생";
            drawTimelineUI();
            runSongSequencer();
        }

        function stopPlayback() {
            clearTimeout(intervalId);
            isPlaying = false;
            playingBarMode = -1;
            Object.keys(activeNodes).forEach(k => stopKeyNote(k));

            if (isRecording) {
                toggleRecording(); 
            }

            document.getElementById('playBtn').textContent = "전체 재생";
            document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('playing'));
            document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('current'));
            drawTimelineUI();
        }

        function getStepDurationMs(bpm) { return (60000 / bpm) / 4; }

        function runSongSequencer() {
            function nextStep() {
                if (!isPlaying) return;

                const startStepIndex = (playingBarMode !== -1) ? (playingBarMode * COLS) : 0;
                const endStepIndex = (playingBarMode !== -1) ? ((playingBarMode + 1) * COLS) : (totalBars * COLS);
                const stepSpan = endStepIndex - startStepIndex;

                const currentBar = Math.floor(currentTimelineStep / COLS);
                const currentStepInBar = currentTimelineStep % COLS;

                document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('current'));
                const activeBarBlock = document.getElementById(`bar-${currentBar}`);
                if(activeBarBlock) activeBarBlock.classList.add('current');

                const prevStepInBar = (currentStepInBar - 1 + COLS) % COLS;

                for (let r = 0; r < ROWS; r++) {
                    const pBtn = document.getElementById(`btn-${r}-${prevStepInBar}`);
                    if(pBtn) pBtn.classList.remove('playing');

                    const cBtn = document.getElementById(`btn-${r}-${currentStepInBar}`);
                    if(cBtn) cBtn.classList.add('playing');

                    tracks.forEach((track, tIdx) => {
                        const patternIdx = songTimelineState[tIdx][currentBar];
                        const key = `${tIdx}-${r}`;
                        const cell = track.patterns[patternIdx][r][currentStepInBar];

                        if (cell.on) {
                            const relativePos = currentTimelineStep - startStepIndex;
                            const prevStepGlobal = startStepIndex + ((relativePos - 1 + stepSpan) % stepSpan);
                            const prevBar = Math.floor(prevStepGlobal / COLS);
                            const prevStepInBarVal = prevStepGlobal % COLS;
                            const prevPatternIdx = songTimelineState[tIdx][prevBar];
                            const prevCell = track.patterns[prevPatternIdx][r][prevStepInBarVal];

                            const isContinuedTie = cell.tie && prevCell.on;

                            if (!isContinuedTie) {
                                let sustainLength = 1;
                                for (let s = 1; s < stepSpan; s++) {
                                    const checkStepGlobal = startStepIndex + ((relativePos + s) % stepSpan);
                                    const checkBar = Math.floor(checkStepGlobal / COLS);
                                    const checkStepInBar = checkStepGlobal % COLS;
                                    const checkPatternIdx = songTimelineState[tIdx][checkBar];
                                    const nextCell = track.patterns[checkPatternIdx][r][checkStepInBar];

                                    if (nextCell.on && nextCell.tie) {
                                        sustainLength++;
                                    } else {
                                        break;
                                    }
                                }

                                const stepDurationSec = (60 / currentBPM) / 4;
                                const totalToneDuration = stepDurationSec * sustainLength;

                                stopKeyNote(key);
                                const node = playTone(FREQUENCIES[r], track.instrument, track.volume, totalToneDuration, key, track.audioBuffer);
                                if (node) activeNodes[key] = node;
                            }
                        } else {
                            stopKeyNote(key);
                        }
                    });
                }

                const relativePos = currentTimelineStep - startStepIndex;
                currentTimelineStep = startStepIndex + ((relativePos + 1) % stepSpan);

                intervalId = setTimeout(nextStep, getStepDurationMs(currentBPM));
            }
            nextStep();
        }

        function generateMidiExport() {
            const midiHeader = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x60];
            let trackEvents = []; const tickPerStep = 48; 
            const totalSteps = totalBars * COLS;

            tracks.forEach((track, tIdx) => {
                for (let r = 0; r < ROWS; r++) {
                    let step = 0;
                    while (step < totalSteps) {
                        const bar = Math.floor(step / COLS);
                        const stepInBar = step % COLS;
                        const pIdx = songTimelineState[tIdx][bar];
                        const cell = track.patterns[pIdx][r][stepInBar];

                        if (cell.on && !cell.tie) {
                            const startStep = step;
                            let length = 1;
                            step++;

                            while (step < totalSteps) {
                                const cBar = Math.floor(step / COLS);
                                const cStepInBar = step % COLS;
                                const cPIdx = songTimelineState[tIdx][cBar];
                                const nextCell = track.patterns[cPIdx][r][cStepInBar];

                                if (nextCell.on && nextCell.tie) {
                                    length++;
                                    step++;
                                } else {
                                    break;
                                }
                            }

                            const startTick = startStep * tickPerStep;
                            const endTick = (startStep + length) * tickPerStep - 8;
                            const note = MIDI_NOTES[r];
                            const midiVel = Math.round((track.volume / 100) * 127);

                            trackEvents.push({ tick: startTick, type: 0x90 + tIdx, note: note, vel: midiVel });
                            trackEvents.push({ tick: endTick, type: 0x80 + tIdx, note: note, vel: 0 });
                        } else {
                            step++;
                        }
                    }
                }
            });

            trackEvents.sort((a, b) => a.tick - b.tick);
            function writeVarInt(value) {
                let buffer = []; if (value === 0) return [0];
                while (value > 0) { buffer.push(value & 0x7F); value >>= 7; }
                buffer.reverse();
                for (let i = 0; i < buffer.length - 1; i++) buffer[i] |= 0x80;
                return buffer;
            }
            let trackData = []; let currentTick = 0;
            trackEvents.forEach(evt => {
                let deltaTime = evt.tick - currentTick; currentTick = evt.tick;
                trackData.push(...writeVarInt(deltaTime)); trackData.push(evt.type, evt.note, evt.vel);
            });
            trackData.push(0x00, 0xFF, 0x2F, 0x00);
            const len = trackData.length;
            const midiTrackHeader = [0x4d, 0x54, 0x72, 0x6b, (len >> 24) & 0xFF, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF];
            const finalMidiBlob = new Uint8Array([...midiHeader, ...midiTrackHeader, ...trackData]);
            const blob = new Blob([finalMidiBlob], { type: "audio/midi" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = "multitrack-composition.mid"; a.click();
        }

        window.onload = startApplication;
    </script>
</body>
</html>
