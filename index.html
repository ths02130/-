<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>패턴 간단 작곡 프로그램</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; padding: 15px; margin: 0; }
        h1 { font-size: 1.4rem; margin-bottom: 5px; color: #fff; }
        .section-title { font-size: 1rem; color: #00adb5; margin-top: 20px; font-weight: bold; }
        
        /* 상단 템포(BPM) 및 유틸리티 컨트롤 */
        .global-status-bar { background: #111; padding: 12px; margin: 10px auto; max-width: 95%; border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap; }
        .bpm-container { display: flex; align-items: center; gap: 10px; font-weight: bold; }
        .bpm-slider { width: 130px; cursor: pointer; }
        .bpm-display { color: #ffc107; font-size: 1.1rem; min-width: 65px; }
        
        /* 총 재생 시간 표시 박스 */
        .duration-display { background: #222; border: 1px solid #00adb5; color: #00adb5; padding: 5px 12px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; }
        .save-indicator { font-size: 0.8rem; color: #28a745; font-weight: bold; border: 1px solid #28a745; padding: 3px 8px; border-radius: 4px; }

        /* 레이어(트랙) 선택 탭 */
        .layer-selector { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
        .layer-btn { padding: 10px 20px; font-size: 0.95rem; font-weight: bold; background: #444; color: #aaa; border: none; border-radius: 6px; cursor: pointer; }
        .layer-btn.inst-active { background: #ff5722; color: #fff; box-shadow: 0 0 8px #ff5722; }
        .layer-btn.vocal-active { background: #e91e63; color: #fff; box-shadow: 0 0 8px #e91e63; }

        /* 패턴 매니저 */
        .pattern-manager { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 95%; margin: 10px auto; background: #2a2a2a; padding: 12px; border-radius: 10px; min-height: 50px; }
        .pattern-item { display: flex; flex-direction: column; align-items: center; background: #333; padding: 6px; border-radius: 6px; border: 1px solid #444; width: 90px; }
        .pattern-item.active { border-color: #00adb5; background: #243536; }
        .p-select-btn { width: 100%; padding: 5px 0; font-weight: bold; background: #444; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 5px; font-size: 0.8rem; }
        .pattern-item.active .p-select-btn { background: #00adb5; }
        .p-name-input { width: 90%; font-size: 0.7rem; padding: 2px; border: 1px solid #555; background: #222; color: #fff; text-align: center; border-radius: 3px; box-sizing: border-box; }
        
        /* 유틸리티 바 버튼들 */
        .util-bar { margin: 10px 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .util-btn { padding: 6px 14px; font-size: 0.85rem; background: #4f5b66; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .undo-btn { background: #dc3545; color: white; }
        .undo-btn:disabled { background: #444; color: #777; cursor: not-allowed; }
        .new-project-btn { background: #6f42c1; color: white; }
        .file-io-btn { background: #007bff; color: white; }

        /* 격자판 */
        .grid-viewport { overflow-x: auto; background: #1a1a1a; border-radius: 12px; padding: 15px 10px; margin: 10px auto; max-width: 98%; }
        .grid { display: grid; grid-template-columns: repeat(16, 36px); gap: 10px 8px; justify-content: start; width: max-content; }
        .note-btn { width: 36px !important; height: 45px !important; min-width: 36px; box-sizing: border-box; background: #444; border: 2px solid transparent; border-radius: 6px; cursor: pointer; }
        
        .note-btn.inst-on { background: #ff5722 !important; box-shadow: 0 0 6px #ff5722; }
        .note-btn.vocal-on { background: #e91e63 !important; box-shadow: 0 0 6px #e91e63; }
        .note-btn.playing { border-color: #fff; background: #555; }
        .note-btn.inst-on.playing, .note-btn.vocal-on.playing { border-color: #fff; filter: brightness(1.4); }

        /* 하단 조립 타임라인 */
        .timeline-area { background: #2a2a2a; padding: 15px; border-radius: 12px; max-width: 95%; margin: 15px auto; }
        .timeline-container { display: flex; gap: 8px; justify-content: start; margin: 15px 0; overflow-x: auto; padding-bottom: 10px; }
        .timeline-block { background: #333; border: 2px solid #555; border-radius: 6px; padding: 6px; width: 100px; text-align: center; flex-shrink: 0; }
        .timeline-block.current { border-color: #ffc107; background: #443c25; }
        .timeline-label { font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; color: #aaa; }
        .timeline-block select { background: #222; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 2px; width: 100%; cursor: pointer; font-size: 0.75rem; margin-bottom: 4px; }

        /* 마디 조절 버튼 */
        .bar-control-btn { padding: 6px 14px; font-size: 0.85rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; margin: 0 5px; }
        .add-bar { background: #00adb5; color: white; }
        .remove-bar { background: #6c757d; color: white; }

        /* 제어 버튼 */
        .controls { margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        button.main-btn { padding: 12px 20px; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; border: none; min-width: 140px; }
        .play-btn { background: #28a745; color: white; }
        .wav-btn { background: #ffc107; color: black; }
        .midi-btn { background: #007bff; color: white; }
    </style>
</head>
<body>

    <h1>🎵 패턴 간단 작곡 프로그램</h1>

    <!-- 글로벌 대시보드 -->
    <div class="global-status-bar">
        <div class="bpm-container">
            <span>속도 (BPM):</span>
            <input type="range" id="bpmSlider" class="bpm-slider" min="60" max="200" value="120">
            <span id="bpmDisplay" class="bpm-display">120 BPM</span>
        </div>
        <!-- 총 재생 시간 표시 영역 추가 -->
        <div class="duration-display" id="totalDurationDisplay">⏱️ 총 길이: 0분 0초</div>
        <div class="save-indicator" id="saveIndicator">브라우저 자동 저장 활성화됨</div>
    </div>

    <!-- 1단계: 레이어 선택 -->
    <div class="section-title">1단계: 편집할 음악 레이어(트랙) 선택</div>
    <div class="layer-selector">
        <button class="layer-btn inst-active" id="layerInstBtn" onclick="switchLayer('instrument')">🎸 악기 반주 레이어</button>
        <button class="layer-btn" id="layerVocalBtn" onclick="switchLayer('vocal')">🎤 보컬 멜로디 레이어</button>
    </div>
    
    <!-- 2단계: 패턴 관리 -->
    <div class="section-title">2단계: 패턴 선택 및 이름 설정</div>
    <div class="pattern-manager" id="patternManagerContainer"></div>

    <!-- 유틸리티 바 -->
    <div class="util-bar">
        <button class="util-btn new-project-btn" id="newProjectBtn">✨ 새로 만들기</button>
        <button class="util-btn file-io-btn" id="exportJsonBtn">💾 프로젝트 파일 저장 (.json)</button>
        <button class="util-btn file-io-btn" id="importJsonBtn" onclick="document.getElementById('hiddenFileInput').click()">📁 파일 불러오기</button>
        <input type="file" id="hiddenFileInput" accept=".json" style="display: none;">
        
        <button class="util-btn undo-btn" id="undoBtn" disabled>↩ 되돌리기 (Undo)</button>
        <button class="util-btn" id="copyPatternBtn">패턴 복사</button>
        <button class="util-btn" id="pastePatternBtn">붙여넣기</button>
    </div>

    <!-- 16비트 격자판 -->
    <div class="grid-viewport">
        <div class="grid" id="sequencerGrid"></div>
    </div>

    <!-- 3단계: 가변형 타임라인 -->
    <div class="timeline-area">
        <div class="section-title" style="margin-top:0;">3단계: 마디별 패턴 조립 및 길이 확장</div>
        <div class="timeline-container" id="songTimeline"></div>
        <div>
            <button class="bar-control-btn add-bar" id="addBarBtn">+ 마디 추가</button>
            <button class="bar-control-btn remove-bar" id="removeBarBtn">- 마지막 마디 삭제</button>
        </div>
    </div>

    <!-- 제어 버튼 -->
    <div class="controls">
        <div class="btn-group">
            <button class="main-btn play-btn" id="playBtn">전체 재생</button>
            <button class="main-btn wav-btn" id="saveWavBtn">WAV 다운로드</button>
            <button class="main-btn midi-btn" id="saveMidiBtn">MIDI 파일 저장</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'WEBDW_DATA_SAVE_2026';
        const MIDI_NOTES = [72, 71, 69, 67, 65, 64, 62, 60]; 
        const FREQUENCIES = [523.25, 493.88, 440.00, 392.00, 349.23, 329.63, 293.66, 261.63]; 
        const ROWS = FREQUENCIES.length; 
        const COLS = 16; 
        const NUM_PATTERNS = 8;

        let patternBank, currentLayer, currentPatternIdx, patternNames, songTimelineState, currentBPM;
        let undoStack = [];
        const MAX_UNDO = 20;
        let copiedPatternData = null;
        let audioCtx = null, isPlaying = false, intervalId = null, currentTimelineStep = 0, mediaRecorder, audioChunks = [], dest;

        function initDefaultData() {
            patternBank = {
                instrument: Array(NUM_PATTERNS).fill().map(() => Array(ROWS).fill().map(() => Array(COLS).fill(false))),
                vocal: Array(NUM_PATTERNS).fill().map(() => Array(ROWS).fill().map(() => Array(COLS).fill(false)))
            };
            currentLayer = 'instrument'; 
            currentPatternIdx = 0; 
            patternNames = Array(NUM_PATTERNS).fill().map((_, i) => `패턴 ${i + 1}`);
            songTimelineState = {
                instrument: [0, 0, 1, 1],
                vocal: [7, 7, 7, 7] 
            };
            currentBPM = 120;
            undoStack = [];
        }

        // 총 재생 시간 계산 함수
        function calculateTotalDuration() {
            const totalBars = songTimelineState.instrument.length;
            // 4/4박자 기준 1마디 = 4박자 -> 총 박자 수 = 마디 수 * 4
            const totalBeats = totalBars * 4;
            // 총 시간(초) = (60 / BPM) * 총 박자 수
            const totalSeconds = Math.round((60 / currentBPM) * totalBeats);
            
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            const durationDisplay = document.getElementById('totalDurationDisplay');
            if (durationDisplay) {
                durationDisplay.textContent = `⏱️ 총 길이: ${minutes}분 ${seconds}초 (${totalBars}마디)`;
            }
        }

        function saveToLocalStorage() {
            const packed = { patternBank, patternNames, songTimelineState, currentBPM };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(packed));
            const ind = document.getElementById('saveIndicator');
            if(ind) {
                ind.textContent = "✓ 브라우저 자동 저장됨";
                ind.style.borderColor = "#28a745"; ind.style.color = "#28a745";
            }
            calculateTotalDuration();
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) { initDefaultData(); return; }
            try {
                const parsed = JSON.parse(raw);
                patternBank = parsed.patternBank;
                patternNames = parsed.patternNames;
                songTimelineState = parsed.songTimelineState;
                currentBPM = parsed.currentBPM || 120;
                currentLayer = 'instrument';
                currentPatternIdx = 0;
            } catch(e) {
                initDefaultData();
            }
        }

        function startApplication() {
            loadFromLocalStorage();

            document.getElementById('bpmSlider').value = currentBPM;
            document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
            document.getElementById('undoBtn').disabled = (undoStack.length === 0);

            setupEventListeners();

            switchLayer('instrument');
            drawPatternManager();
            drawGrid();
            drawTimelineUI();
            calculateTotalDuration();
        }

        function setupEventListeners() {
            // JSON 저장
            document.getElementById('exportJsonBtn').addEventListener('click', () => {
                const dataStr = JSON.stringify({
                    version: "2026.1", currentBPM, patternNames, songTimelineState, patternBank
                }, null, 2);
                const blob = new Blob([dataStr], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const date = new Date();
                a.download = `simple_music_project_${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}.json`;
                a.href = url; a.click(); URL.revokeObjectURL(url);
            });

            // JSON 불러오기
            document.getElementById('hiddenFileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const parsed = JSON.parse(evt.target.result);
                        if(!parsed.patternBank || !parsed.songTimelineState || !parsed.patternNames) throw new Error("올바른 파일이 아닙니다.");
                        if(isPlaying) document.getElementById('playBtn').click();

                        patternBank = parsed.patternBank;
                        songTimelineState = parsed.songTimelineState;
                        patternNames = parsed.patternNames;
                        currentBPM = parsed.currentBPM || 120;
                        currentLayer = 'instrument'; currentPatternIdx = 0; undoStack = [];

                        document.getElementById('bpmSlider').value = currentBPM;
                        document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
                        document.getElementById('undoBtn').disabled = true;

                        switchLayer('instrument'); drawPatternManager(); drawGrid(); drawTimelineUI(); saveToLocalStorage();
                        alert("📁 프로젝트 파일을 성공적으로 불러왔습니다!");
                    } catch(err) { alert("파일 로드 에러: " + err.message); }
                    e.target.value = '';
                };
                reader.readAsText(file);
            });

            // 되돌리기
            document.getElementById('undoBtn').addEventListener('click', () => {
                if (undoStack.length === 0) return;
                const previousState = undoStack.pop();
                patternBank[previousState.layer][previousState.patternIdx] = previousState.gridData;
                if (currentLayer !== previousState.layer) switchLayer(previousState.layer);
                currentPatternIdx = previousState.patternIdx;
                drawPatternManager(); drawGrid(); saveToLocalStorage();
                document.getElementById('undoBtn').disabled = (undoStack.length === 0);
            });

            // 새로 만들기
            document.getElementById('newProjectBtn').addEventListener('click', () => {
                if(confirm("정말 새로 만드시겠습니까? 현재 작업 내용이 모두 지워집니다.")) {
                    if(isPlaying) document.getElementById('playBtn').click();
                    initDefaultData();
                    document.getElementById('bpmSlider').value = currentBPM;
                    document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
                    document.getElementById('undoBtn').disabled = true;
                    switchLayer('instrument'); drawPatternManager(); drawGrid(); drawTimelineUI(); saveToLocalStorage();
                }
            });

            // 마디 조절
            document.getElementById('addBarBtn').addEventListener('click', () => {
                songTimelineState.instrument.push(0); songTimelineState.vocal.push(7); drawTimelineUI(); saveToLocalStorage();
            });
            document.getElementById('removeBarBtn').addEventListener('click', () => {
                if (songTimelineState.instrument.length > 1) {
                    songTimelineState.instrument.pop(); songTimelineState.vocal.pop(); drawTimelineUI(); saveToLocalStorage();
                }
            });

            // 복사 / 붙여넣기
            document.getElementById('copyPatternBtn').addEventListener('click', () => {
                copiedPatternData = patternBank[currentLayer][currentPatternIdx].map(row => [...row]);
                alert(`패턴 복사 완료!`);
            });
            document.getElementById('pastePatternBtn').addEventListener('click', () => {
                if (!copiedPatternData) return alert("복사된 데이터가 없습니다.");
                saveUndoState();
                patternBank[currentLayer][currentPatternIdx] = copiedPatternData.map(row => [...row]);
                drawGrid(); saveToLocalStorage();
            });

            // 속도 컨트롤
            document.getElementById('bpmSlider').addEventListener('input', (e) => {
                currentBPM = parseInt(e.target.value);
                document.getElementById('bpmDisplay').textContent = `${currentBPM} BPM`;
                saveToLocalStorage();
            });

            document.getElementById('playBtn').addEventListener('click', togglePlayback);
            document.getElementById('saveWavBtn').addEventListener('click', downloadWavRecording);
            document.getElementById('saveMidiBtn').addEventListener('click', generateMidiExport);
        }

        function getStepDurationMs(bpm) { return (60000 / bpm) / 4; }

        function switchLayer(layer) {
            currentLayer = layer;
            const instBtn = document.getElementById('layerInstBtn');
            const vocalBtn = document.getElementById('layerVocalBtn');
            if (layer === 'instrument') {
                instBtn.classList.add('inst-active'); vocalBtn.classList.remove('vocal-active');
            } else {
                instBtn.classList.remove('inst-active'); vocalBtn.classList.add('vocal-active');
            }
            drawGrid();
        }

        function saveUndoState() {
            const snapShot = {
                layer: currentLayer, patternIdx: currentPatternIdx,
                gridData: patternBank[currentLayer][currentPatternIdx].map(row => [...row])
            };
            undoStack.push(snapShot);
            if (undoStack.length > MAX_UNDO) undoStack.shift();
            document.getElementById('undoBtn').disabled = false;
        }

        function drawPatternManager() {
            const pManager = document.getElementById('patternManagerContainer');
            if(!pManager) return;
            
            pManager.innerHTML = '';
            for (let i = 0; i < NUM_PATTERNS; i++) {
                const item = document.createElement('div');
                item.classList.add('pattern-item');
                if (i === currentPatternIdx) item.classList.add('active');
                
                const btn = document.createElement('button');
                btn.classList.add('p-select-btn'); btn.textContent = `P${i + 1}`;
                btn.addEventListener('click', () => { currentPatternIdx = i; drawPatternManager(); drawGrid(); });
                
                const input = document.createElement('input');
                input.classList.add('p-name-input'); input.type = 'text'; input.value = patternNames[i];
                input.addEventListener('input', (e) => {
                    patternNames[i] = e.target.value || `패턴 ${i + 1}`;
                    drawTimelineUI(); saveToLocalStorage();
                });
                item.appendChild(btn); item.appendChild(input); pManager.appendChild(item);
            }
        }

        function drawGrid() {
            const gridContainer = document.getElementById('sequencerGrid');
            if(!gridContainer) return;
            
            gridContainer.innerHTML = ''; 
            let currentGrid = patternBank[currentLayer][currentPatternIdx];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const btn = document.createElement('button');
                    btn.classList.add('note-btn'); btn.id = `btn-${r}-${c}`;
                    if (currentGrid[r][c]) btn.classList.add(currentLayer === 'instrument' ? 'inst-on' : 'vocal-on');
                    
                    btn.addEventListener('click', () => {
                        saveUndoState();
                        currentGrid[r][c] = !currentGrid[r][c];
                        if (currentGrid[r][c]) {
                            btn.classList.add(currentLayer === 'instrument' ? 'inst-on' : 'vocal-on');
                        } else {
                            btn.classList.remove('inst-on', 'vocal-on');
                        }
                        saveToLocalStorage();
                    });
                    gridContainer.appendChild(btn);
                }
            }
        }

        function drawTimelineUI() {
            const timelineContainer = document.getElementById('songTimeline');
            if(!timelineContainer) return;

            timelineContainer.innerHTML = '';
            const totalBars = songTimelineState.instrument.length;
            for (let b = 0; b < totalBars; b++) {
                const block = document.createElement('div');
                block.classList.add('timeline-block'); block.id = `bar-${b}`;
                block.innerHTML = `<div class="timeline-label">${b+1}마디</div>`;
                
                const instSelect = document.createElement('select');
                for(let p = 0; p < NUM_PATTERNS; p++) {
                    const opt = document.createElement('option'); opt.value = p; opt.textContent = "🎸 " + patternNames[p];
                    if(songTimelineState.instrument[b] === p) opt.selected = true;
                    instSelect.appendChild(opt);
                }
                instSelect.addEventListener('change', (e) => { songTimelineState.instrument[b] = parseInt(e.target.value); saveToLocalStorage(); });
                block.appendChild(instSelect);

                const vocalSelect = document.createElement('select');
                for(let p = 0; p < NUM_PATTERNS; p++) {
                    const opt = document.createElement('option'); opt.value = p; opt.textContent = "🎤 " + patternNames[p];
                    if(songTimelineState.vocal[b] === p) opt.selected = true;
                    vocalSelect.appendChild(opt);
                }
                vocalSelect.addEventListener('change', (e) => { songTimelineState.vocal[b] = parseInt(e.target.value); saveToLocalStorage(); });
                block.appendChild(vocalSelect);
                timelineContainer.appendChild(block);
            }
        }

        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            dest = audioCtx.createMediaStreamDestination();
            mediaRecorder = new MediaRecorder(dest.stream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'my-music.wav'; a.click();
                audioChunks = [];
            };
        }

        function playTone(freq, type = 'triangle') {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gain); gain.connect(audioCtx.destination); gain.connect(dest);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }

        function togglePlayback() {
            if (!audioCtx) initAudio();
            if (isPlaying) {
                clearTimeout(intervalId);
                if(mediaRecorder.state === "recording") mediaRecorder.stop();
                isPlaying = false;
                document.getElementById('playBtn').textContent = "전체 재생";
                document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('playing'));
                document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('current'));
            } else {
                currentTimelineStep = 0; mediaRecorder.start(); isPlaying = true; runSongSequencer();
                document.getElementById('playBtn').textContent = "정지";
            }
        }

        function runSongSequencer() {
            function nextStep() {
                if (!isPlaying) return;
                const totalBars = songTimelineState.instrument.length;
                const currentBar = Math.floor(currentTimelineStep / COLS);
                const currentStepInBar = currentTimelineStep % COLS;

                document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('current'));
                const activeBarBlock = document.getElementById(`bar-${currentBar}`);
                if(activeBarBlock) activeBarBlock.classList.add('current');

                const instPatternIdx = songTimelineState.instrument[currentBar];
                const vocalPatternIdx = songTimelineState.vocal[currentBar];
                const activeInstGrid = patternBank.instrument[instPatternIdx];
                const activeVocalGrid = patternBank.vocal[vocalPatternIdx];
                const prevStepInBar = (currentStepInBar - 1 + COLS) % COLS;
                
                for (let r = 0; r < ROWS; r++) {
                    const pBtn = document.getElementById(`btn-${r}-${prevStepInBar}`);
                    if(pBtn) pBtn.classList.remove('playing');
                    
                    const isViewingInst = (currentLayer === 'instrument' && instPatternIdx === currentPatternIdx);
                    const isViewingVocal = (currentLayer === 'vocal' && vocalPatternIdx === currentPatternIdx);
                    if (isViewingInst || isViewingVocal) {
                        const cBtn = document.getElementById(`btn-${r}-${currentStepInBar}`);
                        if(cBtn) cBtn.classList.add('playing');
                    }
                    if (activeInstGrid[r][currentStepInBar]) playTone(FREQUENCIES[r], 'triangle');
                    if (activeVocalGrid[r][currentStepInBar]) playTone(FREQUENCIES[r], 'sine');
                }
                currentTimelineStep = (currentTimelineStep + 1) % (totalBars * COLS);
                intervalId = setTimeout(nextStep, getStepDurationMs(currentBPM));
            }
            nextStep();
        }

        function downloadWavRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop(); clearTimeout(intervalId); isPlaying = false;
                document.getElementById('playBtn').textContent = "전체 재생";
                document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('playing'));
                document.querySelectorAll('.timeline-block').forEach(b => b.classList.remove('current'));
            } else { alert("연주 중일 때만 저장이 가능합니다. 전체 재생을 실행해 주세요."); }
        }

        function generateMidiExport() {
            const totalBars = songTimelineState.instrument.length;
            const midiHeader = [0x4d, 0x54, 0x68, 0x64, 0x00, 0x00, 0x00, 0x06, 0x00, 0x00, 0x00, 0x01, 0x00, 0x60];
            let trackEvents = []; const tickPerStep = 48; 
            for (let b = 0; b < totalBars; b++) {
                const instP = songTimelineState.instrument[b]; const vocalP = songTimelineState.vocal[b];
                for (let c = 0; c < COLS; c++) {
                    const absoluteStep = (b * COLS) + c; const absoluteTick = absoluteStep * tickPerStep;
                    for (let r = 0; r < ROWS; r++) {
                        if (patternBank.instrument[instP][r][c]) {
                            const note = MIDI_NOTES[r];
                            trackEvents.push({ tick: absoluteTick, type: 0x90, note: note, vel: 90 }); 
                            trackEvents.push({ tick: absoluteTick + 40, type: 0x80, note: note, vel: 0 });  
                        }
                    }
                    for (let r = 0; r < ROWS; r++) {
                        if (patternBank.vocal[vocalP][r][c]) {
                            const note = MIDI_NOTES[r];
                            trackEvents.push({ tick: absoluteTick, type: 0x91, note: note, vel: 110 }); 
                            trackEvents.push({ tick: absoluteTick + 40, type: 0x81, note: note, vel: 0 });   
                        }
                    }
                }
            }
            trackEvents.sort((a, b) => a.tick - b.tick);
            function writeVarInt(value) {
                let buffer = []; if (value === 0) return [0];
                while (value > 0) { buffer.push(value & 0x7F); value >>= 7; }
                buffer.reverse();
                for (let i = 0; i < buffer.length - 1; i++) buffer[i] |= 0x80;
                return buffer;
            }
            let trackData = []; let currentTick = 0;
            trackEvents.forEach(evt => {
                let deltaTime = evt.tick - currentTick; currentTick = evt.tick;
                trackData.push(...writeVarInt(deltaTime)); trackData.push(evt.type, evt.note, evt.vel);
            });
            trackData.push(0x00, 0xFF, 0x2F, 0x00);
            const len = trackData.length;
            const midiTrackHeader = [0x4d, 0x54, 0x72, 0x6b, (len >> 24) & 0xFF, (len >> 16) & 0xFF, (len >> 8) & 0xFF, len & 0xFF];
            const finalMidiBlob = new Uint8Array([...midiHeader, ...midiTrackHeader, ...trackData]);
            const blob = new Blob([finalMidiBlob], { type: "audio/midi" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = "my-composition.mid"; a.click();
        }

        window.onload = startApplication;
    </script>
